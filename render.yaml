services:
  - type: web
    name: investidor-ia
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn main:app -w 2 -k uvicorn_worker.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /saude
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CONFIAR_PROXY
        sync: false
      - key: EMPRESA_RODAPE
        sync: false
      - key: PYTHON_VERSION
        sync: false
